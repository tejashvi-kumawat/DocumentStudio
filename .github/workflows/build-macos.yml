# Build macOS DMG for Homebrew (no Windows/Linux).
# Use when you only need DocumentStudio-*-macos.dmg.
#
# Actions → "Build macOS DMG" → Run workflow
# Or tag a release (Release workflow also builds macOS).

name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: write

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: |
          flutter config --enable-macos-desktop
          flutter doctor -v

      - name: Cache LibreOffice DMG + brew downloads
        uses: actions/cache@v4
        with:
          path: |
            .tools/macos
            .tools/tessdata
          key: macos-engines-${{ runner.arch }}-${{ hashFiles('scripts/bundle_macos_engines.sh') }}
          restore-keys: |
            macos-engines-${{ runner.arch }}-

      - run: flutter pub get

      - name: Package macOS DMG
        env:
          NONINTERACTIVE: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: bash scripts/macos/package_release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocumentStudio-macos
          path: |
            dist/macos/*.dmg
            dist/macos/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/macos/*.dmg
            dist/macos/*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
