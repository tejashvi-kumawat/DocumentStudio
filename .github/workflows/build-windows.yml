name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read
  actions: write

jobs:
  build_installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Fetch packages
        run: flutter pub get

      - name: Build, bundle engines, package installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\package_release.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DocumentStudio-windows
          path: dist/windows/*
          if-no-files-found: error
