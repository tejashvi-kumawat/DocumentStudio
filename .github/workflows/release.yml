# Tag v* → build Windows + Linux + macOS DMG → GitHub Release.
# Homebrew needs the macOS DMG asset from this release.
#
#   git tag v1.0.3 && git push origin v1.0.3
#
# Manual (no tag): Actions → "Release" → Run workflow
# Or: Actions → "Build macOS DMG" → Run workflow

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - run: flutter pub get

      - name: Package Windows release
        shell: pwsh
        env:
          # Prefer OSUOSL — download.documentfoundation.org often 504s on Actions.
          DS_LIBREOFFICE_VERSION: '26.8.0'
          DS_LIBREOFFICE_MSI_URL: 'https://ftp.osuosl.org/pub/tdf/libreoffice/stable/26.8.0/win/x86_64/LibreOffice_26.8.0_Win_x86-64.msi'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\package_release.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/windows/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev

      - run: flutter pub get
      - run: flutter config --enable-linux-desktop
      - run: flutter build linux --release

      - name: Build .deb
        env:
          DS_LIBREOFFICE_VERSION: '26.8.0'
        run: bash scripts/linux/package_deb.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/linux/*.deb
            dist/linux/*.AppImage
          if-no-files-found: error

  macos:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: |
          flutter config --enable-macos-desktop
          flutter doctor -v

      - name: Cache LibreOffice DMG + brew downloads
        uses: actions/cache@v4
        with:
          path: |
            .tools/macos
            .tools/tessdata
          key: macos-engines-${{ runner.arch }}-${{ hashFiles('scripts/bundle_macos_engines.sh') }}
          restore-keys: |
            macos-engines-${{ runner.arch }}-

      - run: flutter pub get

      - name: Package macOS DMG (engines + ad-hoc sign)
        env:
          NONINTERACTIVE: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          # Prefer OSUOSL — download.documentfoundation.org often 504s on Actions.
          DS_LIBREOFFICE_VERSION: '26.8.1'
          DS_LIBREOFFICE_DMG_URL: 'https://ftp.osuosl.org/pub/tdf/libreoffice/stable/26.8.1/mac/aarch64/LibreOffice_26.8.1_MacOS_aarch64.dmg'
        run: bash scripts/macos/package_release.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/macos/*.dmg
            dist/macos/*.zip
          if-no-files-found: error

  publish:
    needs: [windows, linux, macos]
    # Only attach to a real version tag (v*). Branch workflow_dispatch still
    # uploads job artifacts for download from the Actions UI.
    if: |
      always()
      && !cancelled()
      && startsWith(github.ref, 'refs/tags/')
      && (needs.macos.result == 'success'
          || needs.windows.result == 'success'
          || needs.linux.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/windows/*
            artifacts/linux/*
            artifacts/macos/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
