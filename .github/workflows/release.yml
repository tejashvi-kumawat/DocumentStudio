# Manual only — auto CI disabled to avoid accidental runs on docs/history rewrites.
# Re-enable push/tag triggers when you want Release / installer builds again.

name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - run: flutter pub get

      # Optional Authenticode signing (removes SmartScreen's "unrecognized
      # app"). Skipped when the WINDOWS_CERT_PFX_BASE64 secret is not set.
      - name: Load code-signing certificate
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_B64) { Write-Host "No Windows signing certificate configured."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "ds-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          "DS_WIN_CERT_PFX=$pfx" >> $env:GITHUB_ENV
          "DS_WIN_CERT_PASSWORD=$env:CERT_PASSWORD" >> $env:GITHUB_ENV

      - name: Package Windows release
        shell: pwsh
        env:
          DS_LIBREOFFICE_VERSION: '26.8.0'
          DS_LIBREOFFICE_MSI_URL: 'https://ftp.osuosl.org/pub/tdf/libreoffice/stable/26.8.0/win/x86_64/LibreOffice_26.8.0_Win_x86-64.msi'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\package_release.ps1

      # Optional Microsoft Store package (Store-signed; no SmartScreen).
      # Skipped unless the three MSSTORE_* secrets are set.
      - name: Package Microsoft Store MSIX
        shell: pwsh
        env:
          DS_MSSTORE_IDENTITY_NAME: ${{ secrets.MSSTORE_IDENTITY_NAME }}
          DS_MSSTORE_PUBLISHER: ${{ secrets.MSSTORE_PUBLISHER }}
          DS_MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSSTORE_PUBLISHER_DISPLAY_NAME }}
          DS_LIBREOFFICE_VERSION: '26.8.0'
          DS_LIBREOFFICE_MSI_URL: 'https://ftp.osuosl.org/pub/tdf/libreoffice/stable/26.8.0/win/x86_64/LibreOffice_26.8.0_Win_x86-64.msi'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\package_store_msix.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/windows/*
            !dist/windows/*-store.msix
          if-no-files-found: error

      # For Partner Center upload only (not attached to the GitHub release).
      - name: Upload Microsoft Store package
        uses: actions/upload-artifact@v4
        with:
          name: windows-store
          path: dist/windows/*-store.msix
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev

      - run: flutter pub get
      - run: flutter config --enable-linux-desktop
      - run: flutter build linux --release

      - name: Build .deb
        env:
          DS_LIBREOFFICE_VERSION: '26.8.0'
        run: bash scripts/linux/package_deb.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/linux/*.deb
            dist/linux/*.AppImage
          if-no-files-found: error

  macos:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: |
          flutter config --enable-macos-desktop
          flutter doctor -v

      - name: Cache LibreOffice DMG + brew downloads
        uses: actions/cache@v4
        with:
          path: |
            .tools/macos
            .tools/tessdata
          key: macos-engines-${{ runner.arch }}-${{ hashFiles('scripts/bundle_macos_engines.sh') }}
          restore-keys: |
            macos-engines-${{ runner.arch }}-

      - run: flutter pub get

      # Optional Developer ID signing + notarization (removes Gatekeeper's
      # "can't verify … free of malware"). Skipped without the secrets.
      - name: Import Developer ID certificate
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [[ -z "$CERT_B64" || -z "$SIGN_IDENTITY" ]]; then echo "No Developer ID certificate configured."; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/ds-sign.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/ds-sign.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/ds-sign.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/ds-sign.p12"
          echo "DS_MACOS_SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Package macOS DMG (engines + signing)
        env:
          DS_APPLE_ID: ${{ secrets.APPLE_ID }}
          DS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DS_APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          NONINTERACTIVE: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          DS_LIBREOFFICE_VERSION: '26.8.1'
          DS_LIBREOFFICE_DMG_URL: 'https://ftp.osuosl.org/pub/tdf/libreoffice/stable/26.8.1/mac/aarch64/LibreOffice_26.8.1_MacOS_aarch64.dmg'
        run: bash scripts/macos/package_release.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/macos/*.dmg
            dist/macos/*.zip
          if-no-files-found: error

  publish:
    needs: [windows, linux, macos]
    if: |
      always()
      && !cancelled()
      && startsWith(github.ref, 'refs/tags/')
      && (needs.macos.result == 'success'
          || needs.windows.result == 'success'
          || needs.linux.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/windows/*
            artifacts/linux/*
            artifacts/macos/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
